<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Portal</h1>
    <hr>
    <form>
        <label for="email">Email</label>
        <br>
        <input type="email" id=st_email placeholder="Enter Your Email" required>
        <br><br>
        <label for="password">Password</label>
        <br>
        <input type="password" id="st_pass" placeholder="Enter The Password">
        <br><br>

        <button>Login</button>
        <hr>

        <h3>Student Registration</h3>
        <label for="text">Name</label>
        <br>
        <input type="text" id="Name" placeholder="Enter your Name" required>
        <br><br>
        <label for="email">Email</label>
        <br>
        <input type="email" id="login_mail" placeholder="Enter Your email" required>
        <br><br>
        <label for="password">Password</label>
        <br>
        <input type="password" id="login_password" placeholder="Enter The Password" required>
        <br><br>
        <label for="Age">Age</label>
        <br>
        <input type="number" id="age1" placeholder="Enter your Age" required>
        <br><br>
        <button>Register</button>
        <hr>

        <h3>Contact me</h3>
        <label for="text">Name</label>
        <br>
        <input type="text" id="Regi_name" placeholder="Enter Your Name" required>
        <br><br>
        <label for="email">Email</label>
        <br>
        <input type="email" id="con_mail" placeholder="Enter Your Email">
        <br><br>
        <label for="text">Message</label>
        <br>
        <textarea name="message" id="msg"></textarea>
        <br><br>
        <button>Send</button>

    </form>
</body>
</html>
